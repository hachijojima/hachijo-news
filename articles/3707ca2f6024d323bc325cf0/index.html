</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="3707ca2f6024d323bc325cf0"><h1>アルカディア、漏えい事案の代行報告提出を公表</h1><p>株式会社アルカディアは10月26日18時40分更新の公式ページ第23報で、同意を得たリストと「行政機関の漏えい等事案報告書」を23日に個人情報保護委員会へ提出したと公表した。</p><p>同社は、代行報告への追加回答について、10月中を目途に寄せられたものを順次、同委員会へ報告する予定としている。</p><section class="sources"><span>出典</span><ul><li><a href="https://raiden.site.ktaiwork.jp/archives/4597" rel="noopener">株式会社アルカディア（2026-10-26更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/27/">2026-10-27号</a></li></ul></section></main></body></html>
