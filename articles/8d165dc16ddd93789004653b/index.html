</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="8d165dc16ddd93789004653b"><h1>垂土でイルカ10頭と遭遇　八丈島アルケロンダイビングクラブが報告</h1><p>八丈島アルケロンダイビングクラブは2026年10月27日付の活動報告で、同日の垂土でのダイビング中にミナミハンドウイルカ10頭を見たと伝えた。</p><p>同クラブによると、遭遇したのは2本目のダイビング終盤で、安全停止に向けて他チームとの位置関係や時間差を確認しながら浮上を始めた場面だった。</p><p>イルカは4頭と6頭に分かれており、ダイバーたちに近づいて通過し、全チームが見られたという。</p><section class="sources"><span>出典</span><ul><li><a href="https://archelon-8jo.com/?p=5923" rel="noopener">八丈島アルケロンダイビングクラブ（2026-10-27更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/28/">2026-10-28号</a></li></ul></section></main></body></html>
