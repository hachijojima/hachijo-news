</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="3f0356a0d20f86bb26b7e73e"><h1>八丈町、地域振興補助事業の第3回募集を案内　受付は12月1～17日</h1><p>八丈町は2026年10月29日付の公式ページで、2026年度の地域振興に係る補助事業の第3回募集を案内した。受付期間は2026年12月1日から17日まで。</p><p>町の案内によると、対象は島しょ地域に住む個人・団体で、地域振興を目的とする事業の経費の一部を補助する。</p><p>補助を実施するのは公益財団法人東京都島しょ振興公社で、町は同公社のホームページから申請書類などをダウンロードして申請するよう案内している。</p><section class="sources"><span>出典</span><ul><li><a href="https://www.town.hachijo.tokyo.jp/articles/oshirase-20261029/" rel="noopener">八丈町（2026-10-29更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/31/">2026-10-31号</a></li></ul></section></main></body></html>
