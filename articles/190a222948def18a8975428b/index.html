</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="190a222948def18a8975428b"><h1>東京都、事故予防体験シミュレーター完成版を公表　音声読み上げやキーボード操作に対応</h1><p>東京都は2026年10月26日付の公式ページで、「事故予防体験シミュレーター」に音声読み上げ機能や効果音を加え、キーボードのみでの操作にも対応した完成版を公開したと公表した。</p><p>都によると、シミュレーターは1歳から6歳までの子供の目線で、生活の中に潜む事故の原因を探索しながら学ぶ3Dコンテンツだ。</p><p>都は、パソコン、スマートフォン、タブレットなどから利用できると案内している。</p><section class="sources"><span>出典</span><ul><li><a href="https://www.metro.tokyo.lg.jp/information/press/2026/10/2026102603" rel="noopener">東京都（2026-10-26更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/28/">2026-10-28号</a></li></ul></section></main></body></html>
