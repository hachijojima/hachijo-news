</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="4a96b560a25d6b427b629ada"><h1>八丈町で震度1　小笠原諸島西方沖でM7.0</h1><p>気象庁の2026年10月25日11時17分発表によると、小笠原諸島西方沖を震源とするマグニチュード7.0の地震で、八丈町三根と八丈町富士グランドが震度1を観測した。</p><p>震源の深さは約470km、地震全体の最大震度は3で、同庁は当時、津波の心配はないと説明した。</p><section class="sources"><span>出典</span><ul><li><a href="https://www.jma.go.jp/bosai/quake/data/20261025111715_20261025111028_VXSE5k_1.json" rel="noopener">気象庁（2026-10-25更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/27/">2026-10-27号</a></li></ul></section></main></body></html>
