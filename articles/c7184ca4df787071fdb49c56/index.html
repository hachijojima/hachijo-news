</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="c7184ca4df787071fdb49c56"><h1>八丈高校、外線電話の自動応答化を案内</h1><p class="deck">東京都立八丈高等学校の2026年10月21日付公式ページによる案内。</p><p>東京都立八丈高等学校は、電話の自動応答システムを導入し、2026年10月24日14時頃から外線電話に自動応答で対応する予定と案内した。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://www.metro.ed.jp/hachijo-h/news/2026/10/newsentry_209.html" rel="noopener">東京都立八丈高等学校（2026-10-21更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/27/revisions/1/">2026-10-27号 初版</a></li></ul></section></main></body></html>
