</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="58b14e2bc86ce46f23cddd6c"><h1>八丈町、雇用機会拡充補助金の公募を案内　11月2日から</h1><p>八丈町は、雇用増を伴う創業・事業拡大への補助金を2026年11月2～25日に募集し、午後5時必着と案内している。</p><p>町によると、実施は国と町の2027年度予算成立が前提となる。</p><p>町は応募に当たり、雇用確認や支出の証拠書類に関する会計検査の指摘事項を読むよう求めている。</p><section class="sources"><span>出典</span><ul><li><a href="https://www.town.hachijo.tokyo.jp/chousei/yosan-zaisei/koyoujigyo-hojo/" rel="noopener">八丈町（2026-09-01更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/27/revisions/1/">2026-10-27号 初版</a></li></ul></section></main></body></html>
