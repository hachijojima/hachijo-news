</style></head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="4737ac6ed77d17d90e70ad65"><h1>東海汽船、25～27日の対象便で変更・取消手数料免除</h1><p class="deck">台風30号接近に伴う対応。2026年10月24日付の公式ページで案内。</p><p>東海汽船は、10月25日東京夜発便から27日日中便まで変更・取消手数料を免除し、期間後も当面継続すると案内した。</p><p>ネット予約は出発前日まで自身で手続きでき、当日分は同社お客様センターへ連絡する。</p><p>旅行会社経由は取り扱いが異なる場合があり、申込先への確認を求めている。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://www.tokaikisen.co.jp/news/836684/" rel="noopener">東海汽船（2026-10-24更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/26/">2026-10-26号</a></li></ul></section></main></body></html>
