</style></head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="f16e5f26dc0514b315a21ee5"><h1>八丈町が案内、被災企業支援の完了・報告期限を2027年3月12日へ延長</h1><p class="deck">2026年10月20日付の町公式案内。28日の相談会は電話予約制。</p><p>八丈町によると、2025年の台風22・23号で被災した中小企業等向け支援事業の完了・報告期限を2027年3月12日まで延長した。</p><p>町の案内では、相談会は10月28日9時30分～16時に八丈支庁で開催し、事前予約は東京都産業労働局商工部調整課（03-5320-4744）で受け付ける。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://www.town.hachijo.tokyo.jp/articles/oshirase-20261022-2/" rel="noopener">八丈町（2026-10-22更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/26/">2026-10-26号</a></li></ul></section></main></body></html>
