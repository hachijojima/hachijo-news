</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="a709a9c5d79d0f79a46dff53"><h1>八丈町、PHP脆弱性への対策実施を公表</h1><p class="deck">町公式や病院などのホームページは通常運用と説明</p><p>八丈町は2026年10月23日付の公式ページで、町公式、町立八丈病院、町立図書館、町営バスの各ホームページについて、PHPの脆弱性対策を実施済みと公表した。</p><p>町によると、10月21日の修正パッチ公表後にサーバ事業者等が対応し、現在は通常通り運用している。</p><p>町は、町立小中学校のホームページは該当するPHPを使用しておらず、影響がないことを事業者の声明で確認したとしている。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://www.town.hachijo.tokyo.jp/articles/oshirase-20261023-2/" rel="noopener">八丈町（2026-10-23更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/25/">2026-10-25号</a></li></ul></section></main></body></html>
