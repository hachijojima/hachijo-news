</style></head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="67b84c55227f0ce47987642b"><h1>資料解説：八丈町広報2026年10月号、歯と口の健診期限を訂正</h1><p class="deck">「歯と口の健康診断」の受診期限は2027年2月末と案内されている。</p><p>八丈町の「広報はちじょう」2026年10月号によると、9月号11ページの「歯と口の健康診断について」に受診期限の誤りがあった。</p><p>同号では、2026年9月末としていた期限を2027年2月末に訂正している。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf#page=9" rel="noopener">八丈町（広報はちじょう 2026年10月号・9頁）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/28/">2026-10-28号</a></li></ul></section></main></body></html>
