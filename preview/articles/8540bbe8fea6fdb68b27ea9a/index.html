</style></head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="8540bbe8fea6fdb68b27ea9a"><h1>八丈町の広報資料解説：コロナワクチン費用の訂正</h1><p class="deck">「広報はちじょう」2026年10月号に掲載された自己負担額と対象条件を確認する。</p><p>八丈町の「広報はちじょう」2026年10月号によると、9月号で案内したコロナワクチンの自己負担額は、3,000円から12,000円に訂正された。</p><p>同号によると、訂正の対象は接種時点で65歳以上の方と、60～64歳で身体障がい者手帳1級を持つ方。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf#page=9" rel="noopener">八丈町（広報はちじょう 2026年10月号・9頁）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/27/">2026-10-27号</a></li></ul></section></main></body></html>
