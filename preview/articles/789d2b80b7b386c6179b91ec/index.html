</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="789d2b80b7b386c6179b91ec"><h1>八丈町「子育て家族」写真展の応募条件　2026年10月号の資料解説</h1><p class="deck">「広報はちじょう」の募集案内から、締切と写真の権利条件を確認する。</p><p>八丈町の公表資料によると、応募は町在住者が対象で、撮影から1年以内の家族のふれあいを写した写真を10月30日必着で募る。</p><p>被写体の承諾と町への無制限の使用権許諾が必要で、著作権は応募者に帰属する。</p><p>同資料では、写真の内容によっては展示できないとしている。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf#page=9" rel="noopener">八丈町（広報はちじょう 2026年10月号・9頁）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/27/">2026-10-27号</a></li></ul></section></main></body></html>
