</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="d3042103038a89ba3f61241b"><h1>八丈町議選の公式記録　2026年10月18日付の投票・開票結果</h1><p class="deck">八丈町の公式ページを基に、10月18日執行の町議選の投票状況を整理する。</p><p>八丈町の2026年10月18日付公式ページによると、同日執行の町議選の投票総数は3,688票で、有効投票数は3,650票、無効投票数は38票だった。</p><p>町の公表資料では、投票率は66.53％で、前回の67.57％を下回った。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://www.town.hachijo.tokyo.jp/articles/oshirase-20261018/" rel="noopener">八丈町（2026-10-22更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/26/">2026-10-26号</a></li></ul></section></main></body></html>
