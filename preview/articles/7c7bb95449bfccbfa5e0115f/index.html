</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="7c7bb95449bfccbfa5e0115f"><h1>八丈町のシルバーパス案内を解説　広報2026年10月号</h1><p class="deck">手元の更新申請書は10月30日まで使用可能</p><p>八丈町の「広報はちじょう」2026年10月号によると、満70歳以上の都民が購入できる東京都シルバーパスは、手元の更新申請書で10月30日まで手続きできる。</p><p>受付は企業課運輸係で常時行い、申請後は約2週間で自宅に郵送されると案内している。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf#page=10" rel="noopener">八丈町（広報はちじょう 2026年10月号・10頁）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/27/">2026-10-27号</a></li></ul></section></main></body></html>
