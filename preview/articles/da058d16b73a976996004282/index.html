</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="da058d16b73a976996004282"><h1>漁協女性部の新商品開発　2026年10月号の水産だよりから</h1><p class="deck">東京都八丈支庁の「八丈島水産だより」を基に、島の魚を活用する取り組みを紹介する資料解説。</p><p>公表資料によると、漁協女性部は魚の通販サイト運営事業者と連携し、新商品開発に取り組んでいる。</p><p>同資料では、9月に事業者が八丈島の加工現場を見学し、意見交換を通じて活用できそうな魚種や味付けを検討したという。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://www.soumu.metro.tokyo.lg.jp/documents/d/soumu/b-suisan2026_10#page=1" rel="noopener">東京都八丈支庁（八丈島水産だより 2026-10号・1頁）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/28/">2026-10-28号</a></li></ul></section></main></body></html>
