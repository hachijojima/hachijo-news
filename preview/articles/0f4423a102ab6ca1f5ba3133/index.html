</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="0f4423a102ab6ca1f5ba3133"><h1>八丈町の資料解説：2026年10月号に見る八丈病院の経営課題</h1><p class="deck">「広報はちじょう」掲載の2026年8月7日運営協議会議事要旨を読む。</p><p>八丈町の公表資料に掲載された2026年8月7日の町立八丈病院運営協議会議事要旨によると、会議時点で一般病床52床に対し入院患者は25人と説明された。</p><p>同議事要旨では、入院患者の減少が収入に大きく影響するため、経営会議で検討していると説明された。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://prd-hachijo.s3.ap-northeast-1.amazonaws.com/wp-content/uploads/2026/08/02163126/hachijo2610.pdf#page=23" rel="noopener">八丈町（広報はちじょう 2026年10月号・23頁）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/27/">2026-10-27号</a></li></ul></section></main></body></html>
