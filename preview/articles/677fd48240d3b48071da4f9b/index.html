</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="677fd48240d3b48071da4f9b"><h1>八丈町の案内から：被災事業者の完了・報告期限延長</h1><p class="deck">2026年10月20日付の公式案内に基づく手続解説。対象は2025年台風第22号・第23号で被災した中小企業等。</p><p>八丈町の案内によると、事業完了・報告期限は2027年3月12日まで延長された。</p><p>町によると、直近の相談会は10月28日に八丈支庁で開かれ、事前予約が必要。</p><p>町が案内する予約先は東京都産業労働局商工部調整課（03-5320-4744）。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://www.town.hachijo.tokyo.jp/articles/oshirase-20261022-2/" rel="noopener">八丈町（2026-10-22更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/26/">2026-10-26号</a></li></ul></section></main></body></html>
