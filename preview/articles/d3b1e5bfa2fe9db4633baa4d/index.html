</head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="d3b1e5bfa2fe9db4633baa4d"><h1>八丈町の登記手続案内を整理　11月10・11日は完全予約制</h1><p class="deck">2026年10月14日付の町公式案内に基づく解説。町によると、住所や氏名・名称の変更登記は2026年4月1日から義務化された。</p><p>八丈町の案内によると、11月10・11日に役場のウェブ会議システムで東京法務局職員が登記手続を案内する。</p><p>完全予約制で、予約期限は11月9日正午。</p><p>予約時には八丈町役場のウェブ会議システムから利用すると伝える。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://www.town.hachijo.tokyo.jp/articles/oshirase-20261014/" rel="noopener">八丈町（2026-10-05更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/26/">2026-10-26号</a></li></ul></section></main></body></html>
