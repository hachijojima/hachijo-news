</style></head><body><main><nav><a href="../../archive/">全号一覧</a> · <a href="../../index.html">最新号</a></nav><article data-public-article-id="cdee24b29a66027c6b9f7caa"><h1>東海汽船、台風30号で予約変更・取消手数料を免除と案内</h1><p class="deck">2026年10月24日付の公式ページで対象便と予約経路別の手続きを案内。</p><p>東海汽船は、台風30号の影響を見込み、10月25日東京夜発便から27日日中便の変更・取消手数料を徴収せず、期間終了後も当面継続すると案内した。</p><p>同社によると、ネット予約は出発日前日まで自身で変更・取消が可能で、旅行会社経由は取扱いが異なる場合がある。</p><section class="sources"><h2>出典</h2><ul><li><a href="https://www.tokaikisen.co.jp/news/836684/" rel="noopener">東海汽船（2026-10-24更新）</a></li></ul></section></article><section><h2>掲載した紙面</h2><ul><li><a href="../../2026/10/26/">2026-10-26号</a></li></ul></section></main></body></html>
